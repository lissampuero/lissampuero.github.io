<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Manuscript illustration editorial project">
  <rect width="800" height="520" fill="#f7f3eb"/>
  <rect x="50" y="50" width="700" height="420" fill="#fff" stroke="#111" stroke-width="2"/>
  <rect x="80" y="80" width="300" height="360" fill="#C4E600" opacity="0.2"/>
  <circle cx="230" cy="250" r="80" fill="#F23C9E" opacity="0.25" stroke="#111" stroke-width="2"/>
  <text x="450" y="130" font-family="Georgia, serif" font-size="24" fill="#111">Manuscript Notes</text>
  <text x="450" y="180" font-family="Georgia, serif" font-size="13" fill="#444">
