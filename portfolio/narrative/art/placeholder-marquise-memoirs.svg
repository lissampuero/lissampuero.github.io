<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" role="img" aria-label="Marquise memoirs parchment layout">
  <rect width="600" height="700" fill="#1a1428"/>
  <!-- Parchment -->
  <path d="M80 60 Q300 30 520 60 L540 640 Q300 670 60 640 Z" fill="#f5e6c8" stroke="#d4a853" stroke-width="3"/>
  <path d="M100 100 Q300 80 480 100" fill="none" stroke="#d4a853" stroke-width="1" opacity="0.5"/>
  <text x="300" y="160" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#3d2a5c" font-style="italic">Chapter IV</text>
  <text x="300" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#111">On the Art of Sovereignty</text>
  <text x="130" y="260" font-family="Georgia, serif" font-size="13" fill="#444">
    <tspan x="130" dy="0">"A kingdom is not measured by its acreage,</tspan>
    <tspan x="130" dy="24">but by the depth of its murk</tspan>
    <tspan x="130" dy="24">and the elegance of its croak."</tspan>
  </text>
  <text x="380" y="380" font-family="Georgia, serif" font-size="12" fill="#6b3fa0" font-style="italic"> The Marquise de Croac</text>
  <!-- Wax seal -->
  <circle cx="300" cy="520" r="45" fill="#6b3fa0" stroke="#d4a853" stroke-width="3"/>
  <text x="300" y="528" text-anchor="middle" font-family="serif" font-size="28" fill="#d4a853">M</text>
</svg>
