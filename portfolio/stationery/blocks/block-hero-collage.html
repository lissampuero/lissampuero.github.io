<!-- BLOCK 1 — Hero moodboard collage (spec Section 11, Block 1) -->
<section class="stn-hero" id="hero-collage" aria-labelledby="stationery-page-title">
  <div class="stn-container stn-container--wide">

    <header class="text-center mb-10 md:mb-14">
      <p class="stn-kicker">Portfolio — Stationery &amp; Products</p>
      <h1 class="stn-page-title" id="stationery-page-title">Stationery &amp; Custom Products</h1>
      <p class="stn-slogan">Small things, big magic.</p>
      <p class="stn-body max-w-2xl mx-auto">
        Small objects, full of intention — illustrated goods designed to be
        held, gifted, and kept.
      </p>
    </header>

    <div class="stn-hero__stage" aria-label="Stationery moodboard collage">

      <div class="stn-hero__mark" aria-hidden="true">
        <p class="stn-hero__mark-text">Liss Ampuero</p>
      </div>

      <!-- Central oval-framed hero illustration -->
      <div class="stn-hero__center">
        <div class="stn-hero__oval-frame">
          <img
            src="../../assets/portfolio/stationery/illustration-stationery-hero-envelope.webp"
            alt="Illustrated stationery hero composition with open envelope and citrus palette, by Liss Ampuero"
            class="stn-hero__center-img"
            width="800"
            height="1000"
            loading="eager"
          />
        </div>
      </div>

      <!-- Scattered supporting elements — rotated, never grid-aligned -->
      <figure class="stn-hero__scatter stn-hero__scatter--envelope">
        <img
          src="../../assets/portfolio/stationery/illustration-stationery-hero-envelope.webp"
          alt=""
          width="320"
          height="240"
          loading="lazy"
          aria-hidden="true"
        />
      </figure>

      <figure class="stn-hero__scatter stn-hero__scatter--fabric">
        <img
          src="../../assets/portfolio/stationery/mockup-product-card-04.webp"
          alt=""
          width="280"
          height="280"
          loading="lazy"
          aria-hidden="true"
        />
      </figure>

      <figure class="stn-hero__scatter stn-hero__scatter--icon-pencil" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="">
          <path d="M8 56L52 12L56 16L12 60H8V56Z" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M48 8L56 16" stroke="#F23C9E" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M8 56L12 60" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </figure>

      <figure class="stn-hero__scatter stn-hero__scatter--icon-stamp" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="">
          <rect x="10" y="14" width="44" height="36" rx="4" stroke="#111" stroke-width="2.5"/>
          <circle cx="32" cy="32" r="10" stroke="#C4E600" stroke-width="2.5"/>
          <path d="M32 26V38M26 32H38" stroke="#111" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </figure>

      <figure class="stn-hero__scatter stn-hero__scatter--icon-heart" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="">
          <path d="M32 52C32 52 10 38 10 24C10 18 14 14 20 14C24 14 28 16 32 20C36 16 40 14 44 14C50 14 54 18 54 24C54 38 32 52 32 52Z" fill="#F23C9E" stroke="#111" stroke-width="2"/>
        </svg>
      </figure>

      <!-- Pantone-style citrus swatch strip -->
      <div class="stn-hero__swatches" aria-label="Citrus brand palette">
        <div class="stn-hero__swatch stn-hero__swatch--fuchsia">
          <span class="stn-hero__swatch-label">Fuchsia</span>
        </div>
        <div class="stn-hero__swatch stn-hero__swatch--yellow">
          <span class="stn-hero__swatch-label">Lemon</span>
        </div>
        <div class="stn-hero__swatch stn-hero__swatch--lime">
          <span class="stn-hero__swatch-label">Lime</span>
        </div>
      </div>

    </div>
  </div>
</section>
